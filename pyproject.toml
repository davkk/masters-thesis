[project]
name = "analysis"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "matplotlib>=3.10.1",
    "mplhep>=0.3.57",
    "pymupdf>=1.26.1",
    "pyroot>=0.3.1",
    "scienceplots>=2.1.1",
    "scipy>=1.15.3",
    "uproot>=5.5.2",
]

[tool.setuptools]
packages = ["analysis"]

tool.uv.package = true
